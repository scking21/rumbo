name: Verify OpenAI Sites candidate
on:
  pull_request:
    paths:
      - 'openai-sites/**'
      - '.github/workflows/verify-sites.yml'
      - 'rumbo/core.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rumbo-sites-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sites-runtime-and-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: openai-sites
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: openai-sites/package-lock.json
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: npm run validate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Retain synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: rumbo-sites-synthetic-browser-evidence
          path: |
            openai-sites/qa-artifacts/
            openai-sites/test-results/
          retention-days: 1
          if-no-files-found: error
      - run: git diff --check
