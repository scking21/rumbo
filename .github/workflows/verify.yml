name: Verify Rumbo
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rumbo-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  full-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, verified 2026-10-01
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install official registry test dependencies
        run: |
          python -m pip install -r requirements-authkit.txt 'playwright==1.62.0' 'jsonschema==4.26.0' 'setuptools==84.0.0' 'wheel==0.48.0'
          python -m playwright install --with-deps chromium
          node --version
      - name: Run all new tests with real Chromium and no skips
        env:
          RUMBO_BROWSER_TESTS: '1'
          RUMBO_SCREENSHOT_DIR: qa-artifacts
        run: python scripts/run_tests.py --strict
      - name: Verify wheel offline in a clean isolated environment
        run: python scripts/verify_installed_wheel.py
      - name: Run preserved Claude adapter tests
        working-directory: claude-plugin/rumbo
        run: python -m unittest discover -s tests -v
      - name: Compile and verify clean whitespace
        run: |
          python -m compileall -q rumbo scripts claude-plugin
          git diff --check
      - name: Save synthetic browser screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: synthetic-board-screenshots
          path: qa-artifacts/*.png
          retention-days: 1
          if-no-files-found: warn
          compression-level: 6
  core-python39:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.9'
      - name: Verify standard-library core floor
        run: |
          python -m unittest discover -s tests -p test_core.py -v
          python -m unittest discover -s tests -p test_protocol.py -v
          python -m unittest discover -s tests -p test_demo.py -v
          python -m unittest discover -s tests -p test_backup.py -v
          python -m unittest discover -s tests -p test_installed.py -v
          python -m unittest discover -s tests -p test_readonly_verify.py -v
          python -m unittest discover -s tests -p test_artifact_json_policy.py -v
          python -m unittest discover -s tests -p test_json_check_cache.py -v
          python -m unittest discover -s tests -p test_decision_clock.py -v
      - name: Verify legacy adapter floor
        working-directory: claude-plugin/rumbo
        run: python -m unittest discover -s tests -v
  deployment-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Exercise isolated deployment packaging with synthetic data only
        run: python deploy/ci_smoke.py
  portability-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ['3.12', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify backup paths and explicit JSON depth boundaries
        run: |
          python -m unittest discover -s tests -p test_backup.py -v
          python -m unittest discover -s tests -p test_installed.py -v
          python -m unittest discover -s tests -p test_protocol.py -v
          python -m unittest discover -s tests -p test_readonly_verify.py -v
          python -m unittest discover -s tests -p test_artifact_json_policy.py -v
          python -m unittest discover -s tests -p test_json_check_cache.py -v
          python -m unittest discover -s tests -p test_decision_clock.py -v
