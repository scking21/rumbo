[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rumbo-referee"
version = "0.3.0"
description = "Provider-neutral contracts, artifact evidence and human-owned acceptance"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Corby King"}]

[project.optional-dependencies]
owner = ["Authlib==1.8.0", "requests>=2.32.5,<3"]

[project.scripts]
rumbo = "rumbo.__main__:main"

[tool.setuptools]
packages = ["rumbo"]

[tool.setuptools.package-data]
rumbo = ["web/*.html"]
